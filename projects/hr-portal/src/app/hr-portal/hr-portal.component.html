<section class="operations-shell" aria-label="Employee directory page">
  <header class="finance-header">
    <div>
      <h1>Employee Directory</h1>
      <p class="subtle">Filter by employee profile, rating, and department with Grid Lite.</p>
    </div>
  </header>

  <igc-grid-lite class="employee-lite-grid" [data]="vm.employees">
    <igc-grid-lite-column field="avatarUrl" header="Avatar" width="7%" [cellTemplate]="vm.employeeAvatarCellTemplate"></igc-grid-lite-column>
    <igc-grid-lite-column field="firstName" header="First Name" width="10%" sortable filterable></igc-grid-lite-column>
    <igc-grid-lite-column field="lastName" header="Last Name" width="10%" sortable filterable></igc-grid-lite-column>
    <igc-grid-lite-column field="satisfactionRating" header="Satisfaction Rating" width="15%" sortable filterable [cellTemplate]="vm.employeeRatingCellTemplate"></igc-grid-lite-column>
    <igc-grid-lite-column field="employmentType" header="Employment Type" width="12%" sortable filterable [cellTemplate]="vm.employeeEmploymentCellTemplate"></igc-grid-lite-column>
    <igc-grid-lite-column field="emailAddress" header="Email Address" width="17%" sortable filterable></igc-grid-lite-column>
    <igc-grid-lite-column field="department" header="Department" width="11%" sortable filterable [cellTemplate]="vm.employeeDepartmentCellTemplate"></igc-grid-lite-column>
    <igc-grid-lite-column field="registeredOn" header="Registered On" width="18%" sortable filterable [cellTemplate]="vm.employeeRegisteredOnCellTemplate"></igc-grid-lite-column>
  </igc-grid-lite>
</section>
